<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getFirestore, collection, query, getDocs, orderBy, where } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
const newsListContainer = document.getElementById('news-list-container');
const loadingIndicator = document.getElementById('loading');
try {
    if (typeof firebaseConfig === 'undefined') { throw new Error("埋め込まれたFirebase設定が見つかりませんでした。"); }
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const appId = 'partnerflux';
    onAuthStateChanged(auth, (user) => {
        if (user) { fetchNews(db, appId); }
        else if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) { signInWithCustomToken(auth, __initial_auth_token).catch(err => console.error(err)); }
        else { signInAnonymously(auth).catch(err => console.error(err)); }
    });
} catch(error) {
    console.error(error);
    loadingIndicator.style.display = 'none';
    newsListContainer.innerHTML = `<p class="text-center text-red-500">${error.message}</p>`;
}
async function fetchNews(db, appId) {
    const newsCollectionPath = `artifacts/${appId}/public/data/news`;
    try {
        const q = query(
            collection(db, newsCollectionPath), 
            where("category", "==", "alliance"), 
            orderBy("registeredAt", "desc")
        );
        const querySnapshot = await getDocs(q);
        const newsList = [];
        querySnapshot.forEach((doc) => newsList.push({ id: doc.id, ...doc.data() }));
        if (loadingIndicator) loadingIndicator.style.display = 'none';
        newsListContainer.innerHTML = ''; 
        if (newsList.length === 0) {
             newsListContainer.innerHTML = `<p class="text-center text-gray-500">登録されている事業提携ニュースがありません。</p>`;
             return;
        }
        newsList.forEach((newsItem) => {
            const displayDate = newsItem.registeredAt ? new Date(newsItem.registeredAt.seconds * 1000).toLocaleDateString('ja-JP') : '日付不明';
            const companyNames = `${newsItem.primaryCompany || '企業A'} × ${newsItem.partnerCompany || '企業B'}`;
            const newsCardHtml = `
                <div class="news-card rounded-xl shadow-lg overflow-hidden">
                    <a href="/news-detail.html?id=${newsItem.id}" class="block p-6">
                        <div class="flex items-start space-x-4">
                            <div class="startup-icon-placeholder rounded-full flex-shrink-0"><span>🤝</span></div>
                            <div class="flex-grow">
                                <div class="flex justify-between items-center mb-1"><p class="text-sm text-gray-500">${displayDate}</p></div>
                                <h3 class="text-xl font-semibold text-gray-800 mb-1 hover:text-blue-600">${companyNames}</h3>
                                <p class="text-md text-gray-700 leading-relaxed">${newsItem.title || '不明'}</p>
                            </div>
                        </div>
                    </a>
                </div>
            `;
            newsListContainer.insertAdjacentHTML('beforeend', newsCardHtml);
        });
    } catch (error) {
        console.error("データの取得中にエラーが発生しました: ", error);
        if (loadingIndicator) loadingIndicator.style.display = 'none';
        newsListContainer.innerHTML = `<p class="text-center text-red-500">データの読み込みに失敗しました。権限を確認してください。</p>`;
    }
}
</script>
