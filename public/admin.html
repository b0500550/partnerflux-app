        body { font-family: 'Inter', sans-serif; background-color: #f4f7f9; }

        .custom-table th, .custom-table td { padding: 12px 15px; border: 1px solid #dee2e6; text-align: left; vertical-align: middle; }
        .custom-table th { background-color: #f8f9fa; font-weight: 600; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background-color: white; padding: 30px; border-radius: 8px; width: 90%; max-width: 700px; max-height: 90vh; overflow-y: auto; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #dee2e6; padding-bottom: 1rem; margin-bottom: 1rem; }

        .close-button { font-size: 1.5rem; cursor: pointer; border: none; background: none; }
        .category-selection legend { font-weight: 500; color: #495057; margin-bottom: 0.75rem; font-size:1rem; }
        .category-selection div { display: flex; gap: 1rem; }
        .category-selection label { display: flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.25rem; border: 1px solid #ced4da; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
        .category-selection input[type="radio"] { display: none; }
        .category-selection input[type="radio"]:checked + label { background-color: #007bff; color: white; border-color: #007bff; box-shadow: 0 0 5px rgba(0,123,255,0.5); }
        .comment-cell { white-space: pre-wrap; word-break: break-all; max-width: 400px; }

<body>
    <div class="admin-container">
        <h1 class="section-title" style="font-size: 2rem; border-bottom: 1px solid #dee2e6; padding-bottom: 1rem;">PartnerFlux 管理ページ</h1>
        
        <fieldset class="category-selection mb-6">
            <legend class="form-label">表示カテゴリ:</legend>
            <div>
                <input type="radio" id="category-funding-filter" name="newsCategoryFilter" value="funding" checked>
                <label for="category-funding-filter">資金調達</label>
                <input type="radio" id="category-alliance-filter" name="newsCategoryFilter" value="alliance">
                <label for="category-alliance-filter">事業提携</label>
            </div>
        </fieldset>

        <div id="manual-add-section">
            <h2 class="section-title">手動ニュース登録</h2>
            <form id="addNewsForm">
                <div>
                    <label for="newsUrl" class="form-label">ニュース記事URL:</label>
                    <input type="url" id="newsUrl" name="newsUrl" class="form-input" placeholder="https://example.com/news/article" required>
                </div>
                <button type="submit" id="submitButton" class="btn btn-primary">記事を登録・分析</button>
                <div id="processingIndicator" class="processing-indicator">処理中... しばらくお待ちください。</div>
            </form>
        </div>
        <div id="messageArea" class="message-area"></div>

        <div class="section-container">
            <h2 class="section-title">問い合わせ一覧</h2>
            <div class="overflow-x-auto">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>受信日時</th>
                            <th>Email</th>
                            <th>コメント</th>
                            <th>ステータス</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="inquiries-list-body"></tbody>
                </table>
            </div>
        </div>
        
        <div class="section-container">
            <div class="flex justify-between items-center mb-6">
                <h2 class="section-title !mb-0">候補ニュース一覧</h2>
                <button id="fetchCandidatesButton" class="btn btn-secondary">現在のカテゴリで候補を更新</button>
            </div>
            
            <div id="bulk-action-container" class="mb-4 flex items-center gap-4" style="display: none;">
                <button id="bulk-analyze-button" class="btn btn-primary btn-sm">選択した項目を分析・登録</button>
                <button id="bulk-reject-button" class="btn btn-danger btn-sm">選択した項目を却下</button>
                <span id="selection-counter" class="text-sm text-gray-600"></span>
            </div>

            <div class="overflow-x-auto">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th class="w-1"><input type="checkbox" id="select-all-candidates"></th>
                            <th>発見日</th>
                            <th>カテゴリ</th>
                            <th>タイトル</th>
                            <th class="w-1/4">操作</th>
                        </tr>
                    </thead>
                    <tbody id="candidate-news-list-body"></tbody>
                </table>
            </div>
        </div>

        <div class="section-container">
            <h2 class="section-title">登録済みニュース一覧</h2>
            <div class="overflow-x-auto">
                <table class="custom-table">
                    <thead><tr><th>登録日</th><th>カテゴリ</th><th>タイトル</th><th class="w-1/4">操作</th></tr></thead>
                    <tbody id="news-list-body"></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <div id="editModal" class="modal-overlay">
        <div class="modal-content">
             <div class="modal-header">
                <h2 class="modal-title">ニュース情報の編集</h2>
                <button id="closeModalButton" class="close-button">&times;</button>
            </div>
            <form id="editNewsForm">
                <input type="hidden" id="editNewsId">
                <input type="hidden" id="editNewsCategory">
                
                <div>
                    <label for="editRegisteredAt" class="form-label">登録日</label>
                    <input type="date" id="editRegisteredAt" class="form-input">
                </div>

                <div id="funding-fields" style="display: none;">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div><label for="editTitle" class="form-label">タイトル</label><input type="text" id="editTitle" class="form-input"></div>
                        <div><label for="editStartupName" class="form-label">スタートアップ名</label><input type="text" id="editStartupName" class="form-input"></div>
                    </div>
                    <div><label for="editBusinessDescription" class="form-label">事業内容</label><input type="text" id="editBusinessDescription" class="form-input"></div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div><label for="editRound" class="form-label">ラウンド</label><input type="text" id="editRound" class="form-input"></div>
                        <div><label for="editFundingAmount" class="form-label">調達金額</label><input type="text" id="editFundingAmount" class="form-input"></div>
                    </div>
                    <div><label for="editLeadInvestor" class="form-label">リード投資家</label><input type="text" id="editLeadInvestor" class="form-input"></div>
                    <div><label for="editSummary" class="form-label">サマリ</label><textarea id="editSummary" class="edit-form-textarea" rows="5"></textarea></div>
                    <div><label for="editPositiveAnalysis" class="form-label">ポジティブ分析</label><textarea id="editPositiveAnalysis" class="edit-form-textarea" rows="5"></textarea></div>
                    <div><label for="editNegativeAnalysis" class="form-label">ネガティブ分析</label><textarea id="editNegativeAnalysis" class="edit-form-textarea" rows="5"></textarea></div>
                    <div><label for="editExitOutlook" class="form-label">Exitの見立て</label><textarea id="editExitOutlook" class="edit-form-textarea" rows="5"></textarea></div>
                </div>
                <div id="alliance-fields" style="display: none;">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div><label for="editAllianceTitle" class="form-label">タイトル</label><input type="text" id="editAllianceTitle" class="form-input"></div>
                        <div><label for="editAllianceType" class="form-label">提携の種類</label><input type="text" id="editAllianceType" class="form-input"></div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div><label for="editPrimaryCompany" class="form-label">主導企業</label><input type="text" id="editPrimaryCompany" class="form-input"></div>
                        <div><label for="editPartnerCompany" class="form-label">提携相手企業</label><input type="text" id="editPartnerCompany" class="form-input"></div>
                    </div>
                    <div><label for="editAllianceSummary" class="form-label">サマリ</label><textarea id="editAllianceSummary" class="edit-form-textarea" rows="5"></textarea></div>
                    <div><label for="editSynergyAnalysis" class="form-label">シナジー分析</label><textarea id="editSynergyAnalysis" class="edit-form-textarea" rows="5"></textarea></div>
                    <div><label for="editRiskAnalysis" class="form-label">リスク分析</label><textarea id="editRiskAnalysis" class="edit-form-textarea" rows="5"></textarea></div>
                    <div><label for="editFutureOutlook" class="form-label">将来の見立て</label><textarea id="editFutureOutlook" class="edit-form-textarea" rows="5"></textarea></div>
                </div>
                <div class="text-right mt-4"><button type="submit" class="btn btn-primary">変更を保存</button></div>
            </form>
        </div>
    </div>
    
    <div id="confirmationModal" class="modal-overlay">
        <div class="modal-content" style="max-width: 450px;">
            <h3 id="confirmationMessage" class="text-lg font-medium mb-6"></h3>
            <div class="flex justify-end gap-4">
                <button id="confirmCancelButton" class="btn btn-secondary">キャンセル</button>
                <button id="confirmActionButton" class="btn btn-danger">実行</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, query, getDocs, doc, deleteDoc, getDoc, updateDoc, orderBy, writeBatch, Timestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // DOM Elements
        const messageArea = document.getElementById('messageArea');
        const submitButton = document.getElementById('submitButton');
        const fetchCandidatesButton = document.getElementById('fetchCandidatesButton');
        const newsListBody = document.getElementById('news-list-body');
        const candidateNewsListBody = document.getElementById('candidate-news-list-body');
        const inquiriesListBody = document.getElementById('inquiries-list-body');
        const selectAllCandidatesCheckbox = document.getElementById('select-all-candidates');
        const bulkActionContainer = document.getElementById('bulk-action-container');
        const bulkAnalyzeButton = document.getElementById('bulk-analyze-button');
        const bulkRejectButton = document.getElementById('bulk-reject-button');
        const selectionCounter = document.getElementById('selection-counter');
        const editModal = document.getElementById('editModal');
        const editNewsForm = document.getElementById('editNewsForm');
        const confirmationModal = document.getElementById('confirmationModal');

        // State & Firebase variables
        let onConfirmCallback = null;
        let auth, userId, db, newsCollectionPath, candidateNewsCollectionPath, inquiriesCollectionPath, processNewsUrl, fetchCandidateNewsUrlBase;
        let allRegisteredNews = [];
        let allCandidateNews = [];
        let allInquiries = [];
        let isBulkProcessing = false;

        // --- 初期化処理 ---
        (async () => {
            submitButton.disabled = true;
            fetchCandidatesButton.disabled = true;

            try {
                if (typeof firebaseConfig === 'undefined') { throw new Error("埋め込まれたFirebase設定が見つかりませんでした。"); }
                const app = initializeApp(firebaseConfig);
                const projectId = firebaseConfig.projectId;
                const appId = 'partnerflux';
                
                auth = getAuth(app);
                db = getFirestore(app);
                
                newsCollectionPath = `artifacts/${appId}/public/data/news`;
                candidateNewsCollectionPath = `artifacts/${appId}/public/data/candidate_news`;
                inquiriesCollectionPath = `artifacts/${appId}/public/data/inquiries`;
                processNewsUrl = `https://asia-northeast1-${projectId}.cloudfunctions.net/processNewsUrl`;
                fetchCandidateNewsUrlBase = `https://asia-northeast1-${projectId}.cloudfunctions.net/fetchCandidateNews`;
                
                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        userId = user.uid;
                        submitButton.disabled = false;
                        fetchCandidatesButton.disabled = false;
                        await fetchAllData();
                    } else if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                });
            } catch (error) {
                console.error("Initialization Error:", error);
                displayMessage(`初期化エラー: ${error.message}`, true);
            }
        })();

        // --- データ取得 & 描画 ---
        async function fetchAllData() {
            displayMessage("全データを読み込んでいます...", false);
            await Promise.all([ 
                fetchAndStoreRegisteredNews(), 
                fetchAndStoreCandidateNews(),
                fetchAndStoreInquiries() 
            ]);
            renderAllLists();
            displayMessage("データの読み込みが完了しました。", false);
            setTimeout(() => { messageArea.style.display = 'none'; }, 2000);
        }

        async function fetchAndStoreRegisteredNews() {
            try {
                const q = query(collection(db, newsCollectionPath));
                const snapshot = await getDocs(q);
                allRegisteredNews = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            } catch (error) { displayMessage("登録済みニュースの読み込みに失敗しました。", true); }
        }
        
        async function fetchAndStoreCandidateNews() {
            try {
                const q = query(collection(db, candidateNewsCollectionPath));
                const snapshot = await getDocs(q);
                allCandidateNews = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            } catch (error) { displayMessage("候補ニュースの読み込みに失敗しました。", true); }
        }
        
        async function fetchAndStoreInquiries() {
            try {
                const q = query(collection(db, inquiriesCollectionPath), orderBy("createdAt", "desc"));
                const snapshot = await getDocs(q);
                allInquiries = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            } catch (error) {
                console.error("Error fetching inquiries:", error);
                displayMessage("問い合わせの読み込みに失敗しました。", true);
            }
        }
        
        function renderAllLists() {
            renderFilteredLists();
            renderInquiriesList();
        }
        
        function renderFilteredLists() {
            const selectedCategory = document.querySelector('input[name="newsCategoryFilter"]:checked').value;
            newsListBody.innerHTML = '';
            const filteredRegistered = allRegisteredNews.filter(news => news.category === selectedCategory);
            
            if (filteredRegistered.length > 0) {
                filteredRegistered.sort((a, b) => {
                    const timeA = a.registeredAt ? a.registeredAt.seconds : 0;
                    const timeB = b.registeredAt ? b.registeredAt.seconds : 0;
                    return timeB - timeA;
                });
                filteredRegistered.forEach(renderRegisteredNewsRow);
            } else {
                newsListBody.innerHTML = `<tr><td colspan="4" class="text-center p-4">このカテゴリの登録済みニュースはありません。</td></tr>`;
            }
            
            candidateNewsListBody.innerHTML = '';
            const filteredCandidates = allCandidateNews.filter(news => news.category === selectedCategory);

            if (filteredCandidates.length > 0) {
                filteredCandidates.sort((a, b) => {
                    const timeA = a.discoveredAt ? a.discoveredAt.seconds : 0;
                    const timeB = b.discoveredAt ? b.discoveredAt.seconds : 0;
                    return timeB - timeA;
                });
                filteredCandidates.forEach(renderCandidateNewsRow);
            } else {
                candidateNewsListBody.innerHTML = `<tr><td colspan="5" class="text-center p-4">このカテゴリの候補ニュースはありません。</td></tr>`;
            }

            updateBulkActionUI();
        }
        
        function renderRegisteredNewsRow(news) {
            const date = news.registeredAt ? new Date(news.registeredAt.seconds * 1000).toLocaleDateString('ja-JP') : '日付不明';
            const categoryText = news.category === 'funding' ? '資金調達' : '事業提携';
            const categoryClass = news.category === 'funding' ? 'bg-sky-100 text-sky-700' : 'bg-emerald-100 text-emerald-700';
            const row = `<tr><td>${date}</td><td><span class="px-2 py-1 text-xs font-semibold rounded-full ${categoryClass}">${categoryText}</span></td><td>${news.title || '(タイトルなし)'}</td><td class="whitespace-nowrap"><button class="btn btn-success btn-sm edit-button" data-id="${news.id}">編集</button> <button class="btn btn-danger btn-sm delete-button" data-id="${news.id}" data-title="${news.title || ''}">削除</button></td></tr>`;
            newsListBody.insertAdjacentHTML('beforeend', row);
        }

        function renderCandidateNewsRow(news) {
            const date = news.discoveredAt ? new Date(news.discoveredAt.seconds * 1000).toLocaleDateString('ja-JP') : '日付不明';
            const categoryText = news.category === 'funding' ? '資金調達' : '事業提携';
            const categoryClass = news.category === 'funding' ? 'bg-sky-100 text-sky-700' : 'bg-emerald-100 text-emerald-700';
            const row = `
                <tr>
                    <td><input type="checkbox" class="candidate-checkbox" data-id="${news.id}" data-url="${news.url}" data-category="${news.category}" data-title="${news.title || ''}"></td>
                    <td>${date}</td>
                    <td><span class="px-2 py-1 text-xs font-semibold rounded-full ${categoryClass}">${categoryText}</span></td>
                    <td><a href="${news.url}" target="_blank" class="text-blue-600 hover:underline">${news.title || '(タイトルなし)'}</a></td>
                    <td class="whitespace-nowrap">
                        <button class="btn btn-primary btn-sm analyze-button" data-id="${news.id}" data-url="${news.url}" data-category="${news.category}">分析・登録</button> 
                        <button class="btn btn-secondary btn-sm reject-button" data-id="${news.id}" data-title="${news.title || ''}">却下</button>
                    </td>
                </tr>`;
            candidateNewsListBody.insertAdjacentHTML('beforeend', row);
        }
        
        function renderInquiriesList() {
            inquiriesListBody.innerHTML = '';
            if (allInquiries.length > 0) {
                allInquiries.forEach(renderInquiryRow);
            } else {
                inquiriesListBody.innerHTML = `<tr><td colspan="5" class="text-center p-4">問い合わせはありません。</td></tr>`;
            }
        }

        function renderInquiryRow(inquiry) {
            const date = inquiry.createdAt ? new Date(inquiry.createdAt.seconds * 1000).toLocaleString('ja-JP') : '日時不明';
            const email = inquiry.email || '（記載なし）';
            const status = inquiry.status || 'new';

            const row = `
                <tr>
                    <td>${date}</td>
                    <td>${email}</td>
                    <td class="comment-cell">${inquiry.comment}</td>
                    <td>${status}</td>
                    <td class="whitespace-nowrap">
                        <button class="btn btn-danger btn-sm delete-inquiry-button" data-id="${inquiry.id}">削除</button>
                    </td>
                </tr>`;
            inquiriesListBody.insertAdjacentHTML('beforeend', row);
        }

        document.getElementById('addNewsForm').addEventListener('submit', handleManualAdd);
        fetchCandidatesButton.addEventListener('click', handleFetchCandidates);
        document.querySelectorAll('input[name="newsCategoryFilter"]').forEach(radio => radio.addEventListener('change', renderFilteredLists));
        
        selectAllCandidatesCheckbox.addEventListener('change', handleSelectAll);
        candidateNewsListBody.addEventListener('change', (e) => e.target.classList.contains('candidate-checkbox') && updateBulkActionUI());
        candidateNewsListBody.addEventListener('click', handleCandidateActions);
        bulkAnalyzeButton.addEventListener('click', handleBulkAnalyze);
        bulkRejectButton.addEventListener('click', handleBulkReject);

        newsListBody.addEventListener('click', handleRegisteredNewsActions);
        inquiriesListBody.addEventListener('click', handleInquiryActions);

        document.getElementById('closeModalButton').addEventListener('click', () => editModal.style.display = 'none');
        document.getElementById('confirmCancelButton').addEventListener('click', () => confirmationModal.style.display = 'none');
        document.getElementById('confirmActionButton').addEventListener('click', () => {
            if (onConfirmCallback) {
                onConfirmCallback().catch(err => displayMessage(`操作に失敗しました: ${err.message}`, true));
            }
            confirmationModal.style.display = 'none';
        });
        editNewsForm.addEventListener('submit', handleEditFormSubmit);

        async function handleFetchCandidates() {
             const selectedCategory = document.querySelector('input[name="newsCategoryFilter"]:checked').value;
             displayMessage(`${selectedCategory === 'funding' ? '資金調達' : '事業提携'}の候補ニュースを取得中です...`, false);
             fetchCandidatesButton.disabled = true;
             try {
                 const functionUrl = `${fetchCandidateNewsUrlBase}?category=${selectedCategory}`;
                 const response = await fetch(functionUrl);
                 const result = await response.json();
                 if (!response.ok) throw new Error(result.message || "候補の取得に失敗しました。");
                 
                 displayMessage(result.message, false);
                 await new Promise(resolve => setTimeout(resolve, 2000));

                 await fetchAndStoreCandidateNews();
                 renderFilteredLists();
             } catch(error) {
                 displayMessage(`エラー: ${error.message}`, true);
             } finally {
                 fetchCandidatesButton.disabled = false;
             }
        }
        
        async function handleManualAdd(e) {
            e.preventDefault();
            const url = document.getElementById('newsUrl').value.trim();
            const category = document.querySelector('input[name="newsCategoryFilter"]:checked').value;
            if (!url) return displayMessage("URLを入力してください。", true);
            submitButton.disabled = true;
            await analyzeAndRegisterNews(url, category).catch(err => console.error(err));
            submitButton.disabled = false;
            document.getElementById('newsUrl').value = '';
        }

        async function handleCandidateActions(event) {
            const target = event.target;
            if (!target.classList.contains('analyze-button') && !target.classList.contains('reject-button')) return;
            const { id, url, category, title } = target.dataset;
            if (target.classList.contains('analyze-button')) {
                target.disabled = true;
                target.textContent = '処理中';
                await analyzeAndRegisterNews(url, category, id).catch(err => console.error(err));
            } else if (target.classList.contains('reject-button')) {
                showConfirmationModal(`候補「${title}」を却下しますか？`, async () => {
                    await deleteDoc(doc(db, candidateNewsCollectionPath, id));
                    displayMessage("候補を却下しました。", false);
                    await fetchAndStoreCandidateNews();
                    renderFilteredLists();
                });
            }
        }

        async function handleRegisteredNewsActions(event) {
            const target = event.target;
            if (!target.classList.contains('edit-button') && !target.classList.contains('delete-button')) return;
            const { id, title } = target.dataset;
            if (target.classList.contains('edit-button')) {
                openEditModal(id);
            } else if (target.classList.contains('delete-button')) {
                showConfirmationModal(`記事「${title}」を本当に削除しますか？`, async () => {
                    await deleteDoc(doc(db, newsCollectionPath, id));
                    displayMessage("ニュースを削除しました。", false);
                    await fetchAndStoreRegisteredNews();
                    renderFilteredLists();
                });
            }
        }
        
        async function handleInquiryActions(event) {
            const target = event.target;
            if (target.classList.contains('delete-inquiry-button')) {
                const { id } = target.dataset;
                showConfirmationModal(`この問い合わせを削除しますか？`, async () => {
                    await deleteDoc(doc(db, inquiriesCollectionPath, id));
                    displayMessage("問い合わせを削除しました。", false);
                    await fetchAndStoreInquiries();
                    renderInquiriesList();
                });
            }
        }

        function handleSelectAll(e) {
            document.querySelectorAll('.candidate-checkbox').forEach(checkbox => {
                checkbox.checked = e.target.checked;
            });
            updateBulkActionUI();
        }

        function updateBulkActionUI() {
            const selectedCheckboxes = document.querySelectorAll('.candidate-checkbox:checked');
            const selectedCount = selectedCheckboxes.length;
            if (selectedCount > 0) {
                bulkActionContainer.style.display = 'flex';
                selectionCounter.textContent = `${selectedCount}件選択中`;
            } else {
                bulkActionContainer.style.display = 'none';
            }
            selectAllCandidatesCheckbox.checked = document.querySelectorAll('.candidate-checkbox').length > 0 && selectedCount === document.querySelectorAll('.candidate-checkbox').length;
        }
        
        function getSelectedCandidates() {
            return Array.from(document.querySelectorAll('.candidate-checkbox:checked')).map(cb => cb.dataset);
        }
        
        async function handleBulkAnalyze() {
            const selected = getSelectedCandidates();
            if (selected.length === 0) return;
            showConfirmationModal(`${selected.length}件のニュースを分析・登録しますか？`, async () => {
                isBulkProcessing = true;
                bulkAnalyzeButton.disabled = true;
                bulkAnalyzeButton.textContent = '処理中...';
                displayMessage(`${selected.length}件の一括処理を開始します...`, false);
                let successCount = 0, errorCount = 0;
                for (const item of selected) {
                    try {
                        await analyzeAndRegisterNews(item.url, item.category, item.id);
                        successCount++;
                        displayMessage(`[${successCount + errorCount}/${selected.length}] 「${item.title}」を登録しました。`, false);
                    } catch (error) {
                        errorCount++;
                        displayMessage(`[${successCount + errorCount}/${selected.length}] 「${item.title}」の処理中にエラーが発生しました。`, true);
                    }
                }
                displayMessage(`一括処理完了: ${successCount}件成功, ${errorCount}件失敗`, errorCount > 0);
                await fetchAllData();
                isBulkProcessing = false;
                bulkAnalyzeButton.disabled = false;
                bulkAnalyzeButton.textContent = '選択した項目を分析・登録';
            });
        }
        
        async function handleBulkReject() {
            const selected = getSelectedCandidates();
            if (selected.length === 0) return;
            showConfirmationModal(`${selected.length}件の候補を却下しますか？`, async () => {
                const batch = writeBatch(db);
                selected.forEach(item => batch.delete(doc(db, candidateNewsCollectionPath, item.id)));
                try {
                    await batch.commit();
                    displayMessage(`${selected.length}件の候補を却下しました。`, false);
                    await fetchAndStoreCandidateNews();
                    renderFilteredLists();
                } catch(error) {
                    displayMessage(`一括却下中にエラーが発生しました: ${error.message}`, true);
                }
            });
        }

        async function analyzeAndRegisterNews(url, category, candidateId = null) {
            if (!userId) { throw new Error("ユーザー認証が完了していません。"); }
            document.getElementById('processingIndicator').style.display = 'block';
            try {
                const response = await fetch(processNewsUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, userId, category }),
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.message || `サーバーエラー: ${response.status}`);
                if (!isBulkProcessing) {
                    displayMessage(`「${result.data.title}」を登録しました。`, false);
                    if (candidateId) await deleteDoc(doc(db, candidateNewsCollectionPath, candidateId));
                    await new Promise(resolve => setTimeout(resolve, 2000));
                    await fetchAllData(); 
                } else if (candidateId) {
                    await deleteDoc(doc(db, candidateNewsCollectionPath, candidateId));
                }
            } catch (error) {
                console.error("分析・登録処理エラー:", error);
                if (!isBulkProcessing) displayMessage(`エラー: ${error.message}`, true);
                throw error;
            } finally {
                document.getElementById('processingIndicator').style.display = 'none';
            }
        }
        
        function displayMessage(message, isError = false) {
             messageArea.textContent = message;
             messageArea.className = 'message-area';
             messageArea.style.display = 'block';
             messageArea.classList.add(isError ? 'message-error' : 'message-success');
        }

        function showConfirmationModal(message, callback) {
            onConfirmCallback = callback;
            confirmationModal.querySelector('#confirmationMessage').textContent = message;
            confirmationModal.style.display = 'flex';
        }

        async function openEditModal(newsId) {
            const docRef = doc(db, newsCollectionPath, newsId);
            const docSnap = await getDoc(docRef);
            if (!docSnap.exists()) {
                displayMessage("編集対象のニュースが見つかりません。", true);
                return;
            }
            const data = docSnap.data();
            const category = data.category || 'funding';
            
            document.getElementById('editNewsId').value = newsId;
            document.getElementById('editNewsCategory').value = category;

            if (data.registeredAt) {
                const registeredDate = data.registeredAt.toDate();
                const year = registeredDate.getFullYear();
                const month = String(registeredDate.getMonth() + 1).padStart(2, '0');
                const day = String(registeredDate.getDate()).padStart(2, '0');
                document.getElementById('editRegisteredAt').value = `${year}-${month}-${day}`;
            }

            const fundingFields = document.getElementById('funding-fields');
            const allianceFields = document.getElementById('alliance-fields');
            
            if (category === 'alliance') {
                fundingFields.style.display = 'none';
                allianceFields.style.display = 'block';
                document.getElementById('editAllianceTitle').value = data.title || '';
                document.getElementById('editPrimaryCompany').value = data.primaryCompany || '';
                document.getElementById('editPartnerCompany').value = data.partnerCompany || '';
                document.getElementById('editAllianceType').value = data.allianceType || '';
                document.getElementById('editAllianceSummary').value = data.summary || '';
                document.getElementById('editSynergyAnalysis').value = data.synergyAnalysis || '';
                document.getElementById('editRiskAnalysis').value = data.riskAnalysis || '';
                document.getElementById('editFutureOutlook').value = data.futureOutlook || '';
            } else {
                allianceFields.style.display = 'none';
                fundingFields.style.display = 'block';
                document.getElementById('editTitle').value = data.title || '';
                document.getElementById('editStartupName').value = data.startupName || '';
                document.getElementById('editBusinessDescription').value = data.businessDescription || '';
                document.getElementById('editRound').value = data.round || '';
                document.getElementById('editFundingAmount').value = data.fundingAmount || '';
                document.getElementById('editLeadInvestor').value = data.leadInvestor || '';
                document.getElementById('editSummary').value = data.summary || '';
                document.getElementById('editPositiveAnalysis').value = data.positiveAnalysis || '';
                document.getElementById('editNegativeAnalysis').value = data.negativeAnalysis || '';
                document.getElementById('editExitOutlook').value = data.exitOutlook || '';
            }
            editModal.style.display = 'flex';
        }

        async function handleEditFormSubmit(event) {
            event.preventDefault();
            const newsId = document.getElementById('editNewsId').value;
            const category = document.getElementById('editNewsCategory').value;
            let updatedData = {};

            const newDateString = document.getElementById('editRegisteredAt').value;
            if (newDateString) {
                const newDate = new Date(newDateString);
                updatedData.registeredAt = Timestamp.fromDate(newDate);
            }

            if (category === 'alliance') {
                updatedData = {
                    ...updatedData,
                    title: document.getElementById('editAllianceTitle').value,
                    primaryCompany: document.getElementById('editPrimaryCompany').value,
                    partnerCompany: document.getElementById('editPartnerCompany').value,
                    allianceType: document.getElementById('editAllianceType').value,
                    summary: document.getElementById('editAllianceSummary').value,
                    synergyAnalysis: document.getElementById('editSynergyAnalysis').value,
                    riskAnalysis: document.getElementById('editRiskAnalysis').value,
                    futureOutlook: document.getElementById('editFutureOutlook').value,
                };
            } else {
                updatedData = {
                    ...updatedData,
                    title: document.getElementById('editTitle').value,
                    startupName: document.getElementById('editStartupName').value,
                    businessDescription: document.getElementById('editBusinessDescription').value,
                    round: document.getElementById('editRound').value,
                    fundingAmount: document.getElementById('editFundingAmount').value,
                    leadInvestor: document.getElementById('editLeadInvestor').value,
                    summary: document.getElementById('editSummary').value,
                    positiveAnalysis: document.getElementById('editPositiveAnalysis').value,
                    negativeAnalysis: document.getElementById('editNegativeAnalysis').value,
                    exitOutlook: document.getElementById('editExitOutlook').value,
                };
            }
            try {
                const docRef = doc(db, newsCollectionPath, newsId);
                await updateDoc(docRef, updatedData);
                displayMessage("ニュース情報を更新しました。", false);
                editModal.style.display = 'none';
                await fetchAndStoreRegisteredNews();
                renderFilteredLists();
            } catch (error) {
                displayMessage("更新に失敗しました。", true);
                console.error("Update failed: ", error);
            }
        }
    </script>
</body>
</html>
