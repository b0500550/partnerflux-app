<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資金調達情報 - PartnerFlux</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
        .header-section { background-color: #ffffff; border-bottom: 1px solid #e5e7eb; }
        /* ★★★★★ ロゴの高さを調整 ★★★★★ */
        .logo-container img { max-height: 96px; }
        .page-title-section { background-color: #2c3e50; color: white; }
        .news-card { background-color: white; border: 1px solid #e5e7eb; transition: box-shadow 0.3s ease-in-out, transform 0.3s ease-in-out; }
        .news-card:hover { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); transform: translateY(-5px); }
        .startup-icon-placeholder { width: 48px; height: 48px; background-color: #e9ecef; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #495057; }
        .loading-spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 2rem auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-gray-800">

    <header class="header-section shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="/" class="logo-container"><img src="/logo.jpg" alt="PartnerFlux Logo" class="h-24"></a>
            <nav><a href="/" class="text-gray-600 hover:text-blue-700 px-3 py-2 rounded-md text-sm font-medium">トップ</a></nav>
        </div>
    </header>

    <section class="page-title-section py-12">
        <div class="container mx-auto px-6 text-center">
            <div class="flex items-center justify-center mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trending-up h-12 w-12 mr-3 text-white"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
                <h1 class="text-4xl font-bold text-white">資金調達</h1>
            </div>
            <p class="text-lg text-gray-300">Fundraising - 最新の資金調達ニュース一覧</p>
        </div>
    </section>

    <main class="container mx-auto px-6 py-12">
        <div id="news-list-container" class="grid grid-cols-1 md:grid-cols-1 lg:grid-cols-1 gap-8">
            <div id="loading" class="text-center py-10">
                <div class="loading-spinner"></div>
                <p class="text-gray-500">データを読み込み中...</p>
            </div>
        </div>
    </main>

    <footer class="bg-gray-900 text-gray-400 mt-16"><div class="container mx-auto px-6 py-8 text-center"><p class="text-sm">&copy; 2025 PartnerFlux. All rights reserved.</p></div></footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getFirestore, collection, query, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

const newsListContainer = document.getElementById('news-list-container');
const loadingIndicator = document.getElementById('loading');

try {
    const env = import.meta.env;
    if (!env || !env.VITE_FIREBASE_API_KEY) { throw new Error("Firebaseの環境変数が読み込めていません。");}
    const firebaseConfig = { apiKey: env.VITE_FIREBASE_API_KEY, authDomain: env.VITE_FIREBASE_AUTH_DOMAIN, projectId: env.VITE_FIREBASE_PROJECT_ID, storageBucket: env.VITE_FIREBASE_STORAGE_BUCKET, messagingSenderId: env.VITE_FIREBASE_MESSAGING_SENDER_ID, appId: env.VITE_FIREBASE_APP_ID };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    onAuthStateChanged(auth, (user) => {
        if (user) { fetchNews(db, firebaseConfig.projectId); } 
        else { signInAnonymously(auth).catch(error => console.error("Anonymous sign-in failed", error)); }
    });
} catch(error) {
    console.error(error);
    loadingIndicator.style.display = 'none';
    newsListContainer.innerHTML = `<p class="text-center text-red-500">${error.message}</p>`;
}

async function fetchNews(db, projectId) {
    const newsCollectionPath = `artifacts/${projectId}/public/data/news`;
    try {
        const q = query(collection(db, newsCollectionPath), orderBy("registeredAt", "desc"));
        const querySnapshot = await getDocs(q);
        const newsList = [];
        querySnapshot.forEach((doc) => newsList.push({ id: doc.id, ...doc.data() }));

        if (loadingIndicator) loadingIndicator.style.display = 'none';
        newsListContainer.innerHTML = ''; 
        if (newsList.length === 0) { newsListContainer.innerHTML = `<p class="text-center text-gray-500">登録されているニュースがありません。</p>`; return; }

        newsList.forEach((newsItem) => {
            // ★★★★★ 日付の表示ロジックを更新 ★★★★★
            const displayDate = (newsItem.publicationDate && newsItem.publicationDate !== '不明')
                ? newsItem.publicationDate
                : (newsItem.registeredAt ? new Date(newsItem.registeredAt.seconds * 1000).toLocaleDateString('ja-JP') : '日付不明');

            const newsCardHtml = `
                <div class="news-card rounded-xl shadow-lg overflow-hidden">
                    <a href="/news-detail.html?id=${newsItem.id}" class="block p-6">
                        <div class="flex items-start space-x-4">
                            <div class="startup-icon-placeholder rounded-full flex-shrink-0"><span>💡</span></div>
                            <div class="flex-grow">
                                <div class="flex justify-between items-center mb-1"><p class="text-sm text-gray-500">${displayDate}</p></div>
                                <h3 class="text-xl font-semibold text-gray-800 mb-1 hover:text-blue-600">${newsItem.startupName || '不明'}</h3>
                                <p class="text-md text-gray-700 leading-relaxed">${newsItem.title || '不明'}</p>
                            </div>
                        </div>
                    </a>
                </div>
            `;
            newsListContainer.insertAdjacentHTML('beforeend', newsCardHtml);
        });
    } catch (error) {
        console.error("データの取得中にエラーが発生しました: ", error);
        if (loadingIndicator) loadingIndicator.style.display = 'none';
        newsListContainer.innerHTML = `<p class="text-center text-red-500">データの読み込みに失敗しました。権限を確認してください。</p>`;
    }
}
</script>
</body>
</html>
