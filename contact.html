<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ - PartnerFlux</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
        .header-section { background-color: #ffffff; border-bottom: 1px solid #e5e7eb; }
        .logo-container img { max-height: 96px; }
        .content-container { max-width: 800px; margin: 4rem auto; padding: 2rem; background-color: #fff; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); }
        h1 { font-size: 2rem; font-weight: 700; color: #1f2937; margin-bottom: 1.5rem; border-bottom: 1px solid #e5e7eb; padding-bottom: 1rem; }
        .form-label { display: block; margin-bottom: 8px; font-weight: 500; color: #495057; }
        .form-input, .form-textarea { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 4px; font-size: 1rem; margin-bottom: 15px; transition: border-color 0.2s, box-shadow 0.2s; }
        .form-input:focus, .form-textarea:focus { border-color: #007bff; box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25); outline: none;}
        .btn { padding: 12px 24px; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; transition: all 0.2s; font-weight: 600; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-primary:hover { background-color: #0056b3; }
        .btn-primary:disabled { background-color: #6c757d; cursor: not-allowed; opacity: 0.7; }
        .message-area { margin-top: 20px; padding: 12px; border-radius: 4px; text-align: center; display: none; }
        .message-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .message-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body class="text-gray-800">

    <header class="header-section shadow-sm">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="/" class="logo-container"><img src="/logo.jpg" alt="PartnerFlux Logo" class="h-24"></a>
            <nav><a href="/" class="text-gray-600 hover:text-blue-700 px-3 py-2 rounded-md text-sm font-medium">トップへ戻る</a></nav>
        </div>
    </header>

    <main>
        <div class="content-container">
            <h1>お問い合わせ</h1>
            <p class="text-gray-600 mb-8">
                PartnerFluxに関するご意見、ご感想、ご要望などをお寄せください。<br>
                返信が必要な場合は、メールアドレスをご記入ください。
            </p>

            <form id="contactForm">
                <div>
                    <label for="email" class="form-label">メールアドレス (任意)</label>
                    <input type="email" id="email" class="form-input" placeholder="reply-to@example.com">
                </div>
                <div>
                    <label for="comment" class="form-label">お問い合わせ内容 (必須)</label>
                    <textarea id="comment" class="form-textarea" rows="8" required placeholder="サービス改善のためのご意見をお待ちしております。"></textarea>
                </div>
                <div class="text-center mt-4">
                    <button type="submit" id="submitButton" class="btn btn-primary w-full">送信する</button>
                </div>
            </form>
            <div id="messageArea" class="message-area"></div>
        </div>
    </main>
    
    <footer class="bg-gray-900 text-gray-400 mt-16">
        <div class="container mx-auto px-6 py-8">
            <div class="flex justify-center space-x-6 mb-6">
                <a href="/operator.html" class="hover:text-white transition-colors duration-300">運営者情報</a>
                <a href="/privacy-policy.html" class="hover:text-white transition-colors duration-300">プライバシーポリシー</a>
                <a href="/disclaimer.html" class="hover:text-white transition-colors duration-300">免責事項</a>
                <a href="/contact.html" class="hover:text-white transition-colors duration-300">お問い合わせ</a>
            </div>
            <p class="text-center text-sm">&copy; 2025 PartnerFlux. All rights reserved.</p>
        </div>
    </footer>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, collection, addDoc, Timestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const contactForm = document.getElementById('contactForm');
    const submitButton = document.getElementById('submitButton');
    const messageArea = document.getElementById('messageArea');

    let db, appId, auth;

    try {
        let firebaseConfig;
        appId = typeof __app_id !== 'undefined' ? __app_id : 'partnerflux';

        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
            firebaseConfig = JSON.parse(__firebase_config);
        } else if (import.meta.env && import.meta.env.VITE_FIREBASE_PROJECT_ID) {
            firebaseConfig = { 
                apiKey: import.meta.env.VITE_FIREBASE_API_KEY,
                authDomain: import.meta.env.VITE_FIREBASE_AUTH_DOMAIN,
                projectId: import.meta.env.VITE_FIREBASE_PROJECT_ID,
                storageBucket: import.meta.env.VITE_FIREBASE_STORAGE_BUCKET,
                messagingSenderId: import.meta.env.VITE_FIREBASE_MESSAGING_SENDER_ID,
                appId: import.meta.env.VITE_FIREBASE_APP_ID,
            };
        } else {
            throw new Error("Firebaseのバックエンド設定を読み込めませんでした。");
        }

        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    signInWithCustomToken(auth, __initial_auth_token).catch(err => console.error(err));
                } else {
                    signInAnonymously(auth).catch(err => console.error(err));
                }
            }
        });
    } catch(error) {
        console.error(error);
        displayMessage("ページの初期化に失敗しました。", true);
    }

    contactForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        submitButton.disabled = true;
        submitButton.textContent = '送信中...';

        const email = document.getElementById('email').value.trim();
        const comment = document.getElementById('comment').value.trim();

        if (!comment) {
            displayMessage('お問い合わせ内容を入力してください。', true);
            submitButton.disabled = false;
            submitButton.textContent = '送信する';
            return;
        }

        try {
            const inquiriesCollectionPath = `artifacts/${appId}/public/data/inquiries`;
            await addDoc(collection(db, inquiriesCollectionPath), {
                email: email,
                comment: comment,
                createdAt: Timestamp.now(),
                status: 'new'
            });

            displayMessage('ご意見ありがとうございます。正常に送信されました。', false);
            contactForm.reset();

        } catch (error) {
            console.error("Error sending inquiry: ", error);
            displayMessage('送信に失敗しました。時間をおいて再度お試しください。', true);
        } finally {
            submitButton.disabled = false;
            submitButton.textContent = '送信する';
        }
    });

    function displayMessage(message, isError = false) {
        messageArea.textContent = message;
        messageArea.className = 'message-area';
        messageArea.style.display = 'block';
        messageArea.classList.add(isError ? 'message-error' : 'message-success');
    }
</script>

</body>
</html>
